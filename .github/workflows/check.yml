name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install verified Gitleaks CLI
        shell: bash
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/pomtum-gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/pomtum-gitleaks" gitleaks
          printf '%s\n' "$RUNNER_TEMP/pomtum-gitleaks" >> "$GITHUB_PATH"
      - name: Full-history secret gate
        run: python scripts/check-publication.py --history
      - name: SDK and local I/O tests
        run: |
          python -m pip install -e './sdk[test]'
          (cd sdk && python -m pytest -q)
          python -B -m unittest discover -s device-io/tests -v
          python -B -m unittest discover -s scripts/tests -v
          bash -n scripts/install-companion.sh
          bash -n scripts/uninstall-companion.sh
      - name: Build local artwork and compare with original C
        run: |
          python scripts/prepare-avatar.py
          python ui/tools/avatar-verify.py
      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build
          npm audit --audit-level=moderate
      - name: Check published source
        run: |
          python scripts/check-publication.py --history
          git diff --check
          test -z "$(git status --porcelain)"
      # Character assets are local generated test inputs; do not upload artifacts.
